<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rock Paper Scissors Game</title>

  <meta name="description"
    content="Play Rock Paper Scissors online! Challenge yourself, beat your opponent and test your luck.">

  <meta name="keywords"
    content="rock paper scissors, rps game, rock paper scissors online">

  <meta name="robots" content="index, follow">

  <link rel="icon" href="/static/images/favicon.png">

  <link rel="stylesheet" href="/static/style.css">

  <script src="/static/script.js" defer></script>
</head>

<body>

  <header class="title-container">
    <img
      src="/static/images/favicon.png"
      class="image-box"
      alt="Game logo">

    <p class="title-box">Rock • Paper • Scissors</p>

    <a class="github-link"
      href="https://github.com/harshaar-git/AAT-Rock-Paper-Scissors"
      target="_blank" rel="noopener noreferrer">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.05c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.76 2.04 3.35 1.44.1-.72.4-1.21.72-1.49-2.48-.28-5.08-1.24-5.08-5.53 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.12-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.3-2.6 5.24-5.09 5.52.4.35.76 1.03.76 2.08V22c0 .3.2.64.77.53A11.1 11.1 0 0 0 12 .9Z"/>
      </svg>

      View Source Code
    </a>
  </header>


  <main class="game-container">

    <h2 class="choose-container">Choose your move</h2>

    <p class="description-container">
      Good luck - have fun!
    </p>


    <div class="buttons-container">

      <button class="rock-button" onclick="playGame('rock')">
        <img
          src="/static/images/rock-emoji.png"
          class="move-icon"
          alt="">
        Rock
      </button>


      <button class="paper-button" onclick="playGame('paper')">
        <img
          src="/static/images/paper-emoji.png"
          class="move-icon"
          alt="">
        Paper
      </button>


      <button class="scissors-button" onclick="playGame('scissors')">
        <img
          src="/static/images/scissors-emoji.png"
          class="move-icon"
          alt="">
        Scissors
      </button>

    </div>


    <section class="result-container" aria-live="polite">

      <p class="r1-box">
        Paper beats Rock <br>
        Rock beats Scissors <br>
        Scissors beats Paper
      </p>

      <p class="r2-box"></p>

    </section>


    <section class="scorecard-container" aria-label="Game score">

      <div class="your-score">
        🏆 Your Score: {{ scorecard.Wins }}
      </div>

      <div class="computer">
        💻 Computer: {{ scorecard.Losses }}
      </div>

      <div class="ties">
        = Ties: {{ scorecard.Ties }} =
      </div>

    </section>


    <button class="reset-score-container" onclick="resetGame()">
      Reset Score
    </button>

  </main>

</body>
</html>
